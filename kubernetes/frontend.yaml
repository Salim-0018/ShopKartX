apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopkartx-frontend
  namespace: shopkartx
  labels:
    app: shopkartx-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shopkartx-frontend
  template:
    metadata:
      labels:
        app: shopkartx-frontend
    spec:
      containers:
        - name: frontend
          image: paul48/shopkartx-frontend:build-17
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: http

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: shopkartx-frontend
  namespace: shopkartx
  labels:
    app: shopkartx-frontend
spec:
  type: NodePort
  selector:
    app: shopkartx-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30080
