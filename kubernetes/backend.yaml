apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopkartx-backend
  namespace: shopkartx
  labels:
    app: shopkartx-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shopkartx-backend
  template:
    metadata:
      labels:
        app: shopkartx-backend
    spec:
      containers:
        - name: backend
          image: paul48/shopkartx-backend:build-17
          imagePullPolicy: Always
          ports:
            - containerPort: 5001
              name: http
          env:
            - name: PORT
              value: "5001"

            - name: NODE_ENV
              value: "production"

            - name: DB_HOST
              value: "shopkartx-mysql"

            - name: DB_PORT
              value: "3306"

            - name: DB_NAME
              value: "shopkartx"

            - name: DB_USER
              value: "shopkartx"

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shopkartx-mysql-secret
                  key: MYSQL_PASSWORD

            - name: REDIS_HOST
              value: "localhost"

            - name: REDIS_PORT
              value: "6379"

            - name: JWT_SECRET
              value: "shopkartx-k8s-jwt-secret"

            - name: FRONTEND_URL
              value: "http://shopkartx-frontend"

          readinessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: shopkartx-backend
  namespace: shopkartx
  labels:
    app: shopkartx-backend
spec:
  type: ClusterIP
  selector:
    app: shopkartx-backend
  ports:
    - name: http
      port: 5001
      targetPort: 5001
