apiVersion: v1
kind: Secret
metadata:
  name: shopkartx-mysql-secret
  namespace: shopkartx
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: shopkartx-root-password
  MYSQL_PASSWORD: shopkartx-password

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: shopkartx-mysql-config
  namespace: shopkartx
data:
  MYSQL_DATABASE: shopkartx
  MYSQL_USER: shopkartx

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: shopkartx-mysql-pvc
  namespace: shopkartx
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopkartx-mysql
  namespace: shopkartx
  labels:
    app: shopkartx-mysql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shopkartx-mysql
  template:
    metadata:
      labels:
        app: shopkartx-mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3306
              name: mysql
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shopkartx-mysql-secret
                  key: MYSQL_ROOT_PASSWORD
            - name: MYSQL_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: shopkartx-mysql-config
                  key: MYSQL_DATABASE
            - name: MYSQL_USER
              valueFrom:
                configMapKeyRef:
                  name: shopkartx-mysql-config
                  key: MYSQL_USER
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shopkartx-mysql-secret
                  key: MYSQL_PASSWORD
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - mysqladmin ping -h 127.0.0.1 -u root -p"$MYSQL_ROOT_PASSWORD"
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - mysqladmin ping -h 127.0.0.1 -u root -p"$MYSQL_ROOT_PASSWORD"
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
      volumes:
        - name: mysql-data
          persistentVolumeClaim:
            claimName: shopkartx-mysql-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: shopkartx-mysql
  namespace: shopkartx
spec:
  type: ClusterIP
  selector:
    app: shopkartx-mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
